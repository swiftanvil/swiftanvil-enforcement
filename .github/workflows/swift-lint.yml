name: SwiftAnvil Lint

on:
  workflow_call:
    inputs:
      swiftanvil-version:
        description: 'SwiftAnvil CLI version to install (e.g. 0.3.0)'
        required: false
        type: string
        default: 'latest'
      lint-package:
        description: 'Run lint package'
        required: false
        type: boolean
        default: true
      lint-source:
        description: 'Run lint source'
        required: false
        type: boolean
        default: true
      lint-tests:
        description: 'Run lint tests'
        required: false
        type: boolean
        default: true
      lint-dependencies:
        description: 'Run lint dependencies'
        required: false
        type: boolean
        default: true
      lint-format:
        description: 'Run SwiftFormat lint'
        required: false
        type: boolean
        default: true
      health-scan:
        description: 'Run swiftanvil health scan'
        required: false
        type: boolean
        default: true
      fail-on-warning:
        description: 'Treat warnings as failures in source lint'
        required: false
        type: boolean
        default: false
      runs-on:
        description: 'Runner OS'
        required: false
        type: string
        default: 'macos-15'

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftAnvil CLI
        run: |
          set -e
          if [ "${{ inputs.swiftanvil-version }}" = "latest" ]; then
            download_url=$(curl -sL https://api.github.com/repos/swiftanvil/swiftanvil-cli/releases/latest \
              | grep "browser_download_url.*SwiftAnvilCLI" \
              | cut -d '"' -f 4 || true)
            if [ -n "$download_url" ]; then
              curl -sL "$download_url" -o /usr/local/bin/swiftanvil
              chmod +x /usr/local/bin/swiftanvil
            else
              echo "No release found. Building from source..."
              git clone --depth 1 https://github.com/swiftanvil/swiftanvil-cli.git /tmp/swiftanvil-cli
              cd /tmp/swiftanvil-cli
              swift build -c release
              cp .build/release/SwiftAnvilCLI /usr/local/bin/swiftanvil
              chmod +x /usr/local/bin/swiftanvil
            fi
          else
            curl -sL \
              "https://github.com/swiftanvil/swiftanvil-cli/releases/download/swiftanvil-cli-${{ inputs.swiftanvil-version }}/SwiftAnvilCLI" \
              -o /usr/local/bin/swiftanvil
            chmod +x /usr/local/bin/swiftanvil
          fi
          swiftanvil --version

      - name: Install SwiftFormat
        if: ${{ inputs.lint-format }}
        run: brew install swiftformat

      - name: Lint Format (SwiftFormat)
        if: ${{ inputs.lint-format }}
        run: |
          if [ -f "swiftanvil-enforcement/configs/swiftformat.yml" ]; then
            swiftformat --lint . --config swiftanvil-enforcement/configs/swiftformat.yml
          elif [ -f "../swiftanvil-enforcement/configs/swiftformat.yml" ]; then
            swiftformat --lint . --config ../swiftanvil-enforcement/configs/swiftformat.yml
          else
            echo "::warning::SwiftFormat config not found; skipping format lint"
          fi

      - name: Lint Package.swift
        if: ${{ inputs.lint-package }}
        run: swiftanvil lint package

      - name: Lint Source
        if: ${{ inputs.lint-source }}
        run: |
          if [ "${{ inputs.fail-on-warning }}" = "true" ]; then
            # Run and capture output; fail if any warnings or errors
            swiftanvil lint source 2>&1 | tee lint-source.log
            if grep -q "⚠️" lint-source.log || grep -q "❌" lint-source.log; then
              echo "::error::Source lint found warnings or errors"
              exit 1
            fi
          else
            swiftanvil lint source
          fi

      - name: Lint Tests
        if: ${{ inputs.lint-tests }}
        run: swiftanvil lint tests

      - name: Lint Dependencies
        if: ${{ inputs.lint-dependencies }}
        run: swiftanvil lint dependencies

      - name: Health Scan
        if: ${{ inputs.health-scan }}
        run: swiftanvil health scan --quick
