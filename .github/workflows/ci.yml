name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML configs
        run: |
          python3 -c "import yaml; yaml.safe_load(open('configs/swiftformat.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('configs/swiftlint.yml'))"

      - name: Validate shell scripts
        run: |
          shellcheck --severity=warning scripts/*.sh || true

      - name: Run enforcement self-tests
        run: bash scripts/test-enforcement.sh
