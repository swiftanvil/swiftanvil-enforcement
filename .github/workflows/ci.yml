name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configs exist and have content
        run: |
          test -s configs/swiftlint.yml
          test -s configs/swiftformat.yml

      - name: Validate SwiftLint config is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('configs/swiftlint.yml'))"

      - name: Validate shell scripts
        run: |
          shellcheck --severity=warning scripts/*.sh || true

      - name: Run enforcement self-tests
        run: bash scripts/test-enforcement.sh
